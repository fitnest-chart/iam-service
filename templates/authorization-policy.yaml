{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "iam-service.fullname" . }}-allow-internal
  labels:
    {{- include "iam-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "iam-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals: {{ .Values.istio.authorization.internalCallers | toJson }}
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/v1/internal/*", "/api/v1/internal/**"]

  - to:
    - operation:
        methods: ["GET"]  
        paths:
          - "/v3/api-docs/*"
          - "/v3/api-docs"
          - "/swagger-ui/*"
          - "/swagger-ui.html"
          - "/actuator/*"
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths:
          - "/api/v1/auth/*"
          - "/api/v1/auth/**"
          - "/api/v1/admin/*"
          - "/api/v1/admin/**"
          - "/api/v1/reference/*"
          - "/api/v1/reference/**"
{{- end }}
