{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "identity-service.fullname" . }}-allow-internal
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "identity-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  # Allow gRPC traffic on port 9090 from internal services
  - from:
    - source:
        {{- if .Values.istio.authorization }}
        {{- if .Values.istio.authorization.internalCallers }}
        principals: {{ .Values.istio.authorization.internalCallers | toJson }}
        {{- end }}
        {{- end }}
    to:
    - operation:
        ports: ["9090"]

  # Allow internal service-to-service calls (HTTP)
  - from:
    - source:
        {{- if .Values.istio.authorization }}
        {{- if .Values.istio.authorization.internalCallers }}
        principals: {{ .Values.istio.authorization.internalCallers | toJson }}
        {{- end }}
        {{- end }}
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/v1/internal/*", "/api/v1/internal/**"]

  # Allow auth, admin, and public endpoints (health, docs)
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths:
          - "/api/v1/auth/register"
          - "/api/v1/auth/register/complete"
          - "/api/v1/auth/login"
          - "/api/v1/auth/refresh"
          - "/api/v1/auth/logout"
          - "/api/v1/auth/me"
          - "/api/v1/auth/otp/send"
          - "/api/v1/auth/otp/verify"
          - "/api/v1/admin/users"
          - "/api/v1/admin/users/*"
          - "/api/v1/admin/users/*/role"
          - "/api/v1/admin/legal/documents"
          - "/api/v1/legal/privacy-policy"
          - "/api/v1/legal/terms-of-use"
          - "/api/v1/legal/consents/accept"
          - "/api/v1/me/consents"
          - "/v3/api-docs"
          - "/v3/api-docs/*"
          - "/swagger-ui/*"
          - "/swagger-ui.html"
          - "/actuator/health"
          - "/actuator/health/*"
          - "/health"
{{- end }}
