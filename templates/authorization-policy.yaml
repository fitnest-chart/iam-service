{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "iam-service.fullname" . }}-allow-internal
  labels:
    {{- include "iam-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "iam-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        namespaces: ["{{ .Release.Namespace }}"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/v1/internal/*"]
{{- end }}
