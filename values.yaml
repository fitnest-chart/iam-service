replicaCount: 1
image:
  repository: ghcr.io/fitnest-backend/identity-service
  tag: "development-c0a244d"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
istio:
  enabled: true
  host: "identity-service"
  mtls:
    mode: STRICT
  authorization:
    internalCallers:
      - "cluster.local/ns/fitnest-dev/sa/user-service"
      - "cluster.local/ns/fitnest-dev/sa/payment-service"
      - "cluster.local/ns/fitnest-dev/sa/catalog-service"
      - "cluster.local/ns/fitnest-dev/sa/order-service"
      - "cluster.local/ns/fitnest-dev/sa/notifications-service"
      - "cluster.local/ns/fitnest-dev/sa/support-service"
      - "cluster.local/ns/fitnest-dev/sa/media-service"
      - "cluster.local/ns/fitnest-dev/sa/fitness-plan-service"
      - "cluster.local/ns/fitnest-dev/sa/api-gateway"
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "600Mi"
env:
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  JWT_SECRET: your-jwt-secret-change-in-production
  JWT_ISSUER: fitnest
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_REFRESH_TTL_SECONDS: "604800"
  SPRING_PROFILES_ACTIVE: dev
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql-shared:5432/fitnest_identity?sslmode=disable
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ""
  SPRING_DATA_REDIS_TIMEOUT: 2000ms
  KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092
  OTP_TTL_SECONDS: "300"
  OTP_MAX_VERIFY_ATTEMPTS: "3"
  OTP_RESEND_COOLDOWN_SECONDS: "30"
  OTP_RATE_LIMIT_MAX_ATTEMPTS: "5"
  OTP_RATE_LIMIT_WINDOW_MINUTES: "15"
  OTP_RATE_LIMIT_COOLDOWN_SECONDS: "60"
  OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS: "5"
  OTP_RATE_LIMIT_ERROR_MESSAGE_THRESHOLD_SECONDS: "30"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
  LOGGING_LEVEL_AZ_FITNEST_IDENTITY: DEBUG
  USER_SERVICE_URL: "http://user-service:8080"
  USER_SERVICE_GRPC_ADDRESS: "dns:///user-service.fitnest-dev.svc.cluster.local:9090"
  ORDER_SERVICE_GRPC_HOST: "order-service"
  ORDER_SERVICE_GRPC_PORT: "9090"
envSecrets:
  GOOGLE_CLIENT_ID:
    secretName: google-secret
    secretKey: client-id
  GOOGLE_CLIENT_SECRET:
    secretName: google-secret
    secretKey: client-secret
resources:
  requests:
    cpu: 20m
    memory: 935Mi
  limits:
    cpu: 1000m
    memory: 1438Mi
