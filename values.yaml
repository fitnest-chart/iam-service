# values.yaml for identity-backend

replicaCount: 1
image:
  repository: ghcr.io/fitnest-code/identity-backend
  tag: "development-33f42d2"
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
  grpcPort: 9090
# NetworkPolicy replaces Istio AuthorizationPolicy
networkPolicy:
  enabled: true
  # Allowed sources (service accounts) are mapped to pod label selectors
  # The gateway-backend is already allowed by default in the template
  extraIngressRules: []
  # Add any additional sources that need direct access (e.g., monitoring)
hpa:
  enabled: false
  minReplicas: "1"
  maxReplicas: "3"
  cpuUtilization: "90"
  memoryUtilization: "600Mi"
env:
  JAVA_TOOL_OPTIONS: >
    -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:MaxMetaspaceSize=256m -XX:+AlwaysPreTouch -Xss512k -XX:+ExitOnOutOfMemoryError

  JWT_SECRET: your-jwt-secret-change-in-production
  JWT_ISSUER: fitnest
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_REFRESH_TTL_SECONDS: "604800"
  SPRING_PROFILES_ACTIVE: dev
  SPRINGDOC_SERVER_URL: "https://dev-api.fitnest.az"
  SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.0.4:5432/fitnest_identity?sslmode=disable
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "shared_password_root_123"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_DATA_REDIS_HOST: "10.0.0.4"
  SPRING_DATA_REDIS_PORT: "6380"
  SPRING_DATA_REDIS_PASSWORD: "ChangeMeDevRedis!"
  SPRING_DATA_REDIS_TIMEOUT: "2000ms"
  KAFKA_BOOTSTRAP_SERVERS: "10.0.0.4:9092"
  OTP_TTL_SECONDS: "300"
  OTP_MAX_VERIFY_ATTEMPTS: "3"
  OTP_RESEND_COOLDOWN_SECONDS: "30"
  OTP_RATE_LIMIT_MAX_ATTEMPTS: "5"
  OTP_RATE_LIMIT_WINDOW_MINUTES: "15"
  OTP_RATE_LIMIT_COOLDOWN_SECONDS: "60"
  OTP_RATE_LIMIT_MIN_COOLDOWN_SECONDS: "5"
  OTP_RATE_LIMIT_ERROR_MESSAGE_THRESHOLD_SECONDS: "30"
  LOGGING_LEVEL_ROOT: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
  LOGGING_LEVEL_AZ_FITNEST_IDENTITY: DEBUG
  USER_BACKEND_URL: "http://user-backend:8080"
  USER_BACKEND_GRPC_ADDRESS: "dns:///user-backend.fitnest-development.svc.cluster.local:9090"
  ORDER_BACKEND_GRPC_HOST: "order-backend"
  ORDER_BACKEND_GRPC_PORT: "9090"
envSecrets:
  GOOGLE_CLIENT_ID:
    secretName: google-secret
    secretKey: client-id
  GOOGLE_CLIENT_SECRET:
    secretName: google-secret
    secretKey: client-secret
resources:
  requests:
    cpu: 20m
    memory: 935Mi
  limits:
    cpu: 1000m
    memory: 1438Mi
